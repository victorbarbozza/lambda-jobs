name: CI
# Public repo: only GitHub runners. A self-hosted runner would run code from anyone's PR.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 🧪 Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: 🔍 Typecheck
        run: bun run typecheck

      - name: 🧪 Test
        run: bun run test

      - name: 🏗️ Build
        run: bun run build

      - name: 📦 Package imports in Node
        run: bun run test:package
