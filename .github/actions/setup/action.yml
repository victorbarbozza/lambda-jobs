name: Setup
description: Node, bun and the dependencies, versioned in one place.

runs:
  using: composite
  steps:
    - name: ⎔ Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: 🧅 Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: 📥 Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
